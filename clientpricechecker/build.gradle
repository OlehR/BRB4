apply plugin: 'com.android.application'

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "ua.uz.vopak.brb4.clientpricechecker"
        minSdkVersion 22
        targetSdkVersion 33
        versionCode 102
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'ua.uz.vopak.brb4.clientpricechecker'
    packagingOptions {
        pickFirst 'jcifs/http/ne.css'
        pickFirst  'jcifs/util/mime.map'
    }

}
configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation project(":share_lib")
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.hierynomus:smbj:0.14.0'
    implementation 'de.psdev.slf4j-android-logger:slf4j-android-logger:1.0.5'
}

